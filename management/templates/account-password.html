<h2>Change Password</h2>

<p>This changes the password used by Nextcloud, Nextcloud Mail, IMAP, and SMTP.</p>

<form id="account-password-form" autocomplete="off">
  <div class="form-group">
    <label for="account-current-password">Current password</label>
    <input class="form-control" id="account-current-password" type="password" autocomplete="current-password" required>
  </div>
  <div class="form-group">
    <label for="account-new-password">New password</label>
    <input class="form-control" id="account-new-password" type="password" autocomplete="new-password" minlength="8" required>
  </div>
  <div class="form-group">
    <label for="account-confirm-password">Confirm new password</label>
    <input class="form-control" id="account-confirm-password" type="password" autocomplete="new-password" minlength="8" required>
  </div>
  <button class="btn btn-primary" type="submit">Change Password</button>
</form>

<div class="alert alert-info" style="margin-top: 1.5em">
  After changing your password, sign out of Nextcloud and sign in again so the Mail app refreshes its IMAP and SMTP credentials.
</div>

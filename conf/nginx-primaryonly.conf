	# S5 appliance control panel. Keep this location ahead of Nextcloud's
	# catch-all routing so /admin is never handled by a Nextcloud app.
	location ^~ /admin/assets/ {
		alias /usr/local/lib/s5mail/vendor/assets/;
	}
	location = /admin {
		return 302 /admin/;
	}
	location = /admin/munin {
		return 302 /admin/munin/;
	}
	location ^~ /admin/ {
		proxy_pass http://127.0.0.1:10222/;
		proxy_set_header X-Forwarded-For $remote_addr;
		add_header X-Frame-Options "DENY";
		add_header X-Content-Type-Options nosniff;
		add_header Content-Security-Policy "script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none';";
	}

	# Nextcloud 34 at the web root, following Nextcloud's nginx layout while
	# reserving the S5 appliance endpoints above.
	index index.php index.html /index.php$request_uri;
	client_max_body_size 16G;
	client_body_timeout 300s;
	fastcgi_buffers 64 4K;

	location = /robots.txt {
		allow all;
		log_not_found off;
		access_log off;
	}

	location = /.well-known/carddav { return 301 /remote.php/dav/; }
	location = /.well-known/caldav { return 301 /remote.php/dav/; }
	location = /.well-known/webfinger { return 301 /index.php/.well-known/webfinger; }
	location = /.well-known/nodeinfo { return 301 /index.php/.well-known/nodeinfo; }
	location = /.well-known/host-meta { return 301 /public.php?service=host-meta; }
	location = /.well-known/host-meta.json { return 301 /public.php?service=host-meta-json; }

	location ~ ^/(?:build|tests|config|lib|3rdparty|templates|data)(?:$|/) {
		return 404;
	}
	location ~ ^/(?:README(?:$|[./])|\.|autotest|occ|issue|indie|db_|console) {
		return 404;
	}

	location / {
		try_files $uri $uri/ /index.php$request_uri;
	}

	location ~ \.php(?:$|/) {
		rewrite ^/(?!index|remote|public|cron|core/ajax/update|status|ocs/v[12]|updater/.+|oc[sm]-provider/.+) /index.php$request_uri;
		fastcgi_split_path_info ^(.+?\.php)(/.*)$;
		set $path_info $fastcgi_path_info;
		try_files $fastcgi_script_name =404;
		include fastcgi_params;
		fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
		fastcgi_param PATH_INFO $path_info;
		fastcgi_param HTTPS on;
		fastcgi_param HTTP_PROXY "";
		fastcgi_param modHeadersAvailable true;
		fastcgi_param front_controller_active true;
		fastcgi_param MOD_X_ACCEL_REDIRECT_ENABLED on;
		fastcgi_param MOD_X_ACCEL_REDIRECT_PREFIX /owncloud-xaccel;
		fastcgi_pass php-fpm;
		fastcgi_intercept_errors on;
		fastcgi_request_buffering off;
		fastcgi_read_timeout 630;
	}

	location ~ \.(?:css|js|mjs|svg|gif|png|jpg|ico|wasm|tflite|map|ogg|flac)$ {
		try_files $uri /index.php$request_uri;
		add_header Cache-Control "public, max-age=15778463, immutable";
		access_log off;
	}
	location ~ \.(?:woff2?|eot|otf|ttf)$ {
		try_files $uri /index.php$request_uri;
		expires 7d;
		access_log off;
	}

	location ^~ /owncloud-xaccel/ {
		internal;
		alias /;
	}

	# ADDITIONAL DIRECTIVES HERE

	location = /s5mail.mobileconfig {
		alias /var/lib/s5mail/mobileconfig.xml;
	}
	# Preserve the previous public URL for existing bookmarks and instructions.
	location = /mailinabox.mobileconfig {
		return 301 /s5mail.mobileconfig;
	}
	location = /.well-known/autoconfig/mail/config-v1.1.xml {
		alias /var/lib/s5mail/mozilla-autoconfig.xml;
	}
	location = /mail/config-v1.1.xml {
		alias /var/lib/s5mail/mozilla-autoconfig.xml;
	}
	location = /.well-known/mta-sts.txt {
		alias /var/lib/s5mail/mta-sts.txt;
	}

	# ADDITIONAL DIRECTIVES HERE

	# Disable viewing sensitive dotfiles (.htaccess, .svn, .git, etc.).
	# This block is placed at the end. Nginx's precedence rules means this block
	# takes precedence over all non-regex matches and only regex matches that
	# come after it (i.e. none of those, since this is the last one.) That means
	# This block does not affect FastCGI-handled locations for Nextcloud or
	# the other services.
	location ~ /\.(ht|svn|git|hg|bzr) {
		log_not_found off;
		access_log off;
		deny all;
	}

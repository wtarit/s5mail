## This file is rendered by setup/mail-dovecot.sh. Do not edit on the host.
## It deliberately does not include Debian's sample conf.d files: their
## defaults and syntax are not an appliance interface.

dovecot_config_version = 2.4.0
dovecot_storage_version = 2.4.0

protocols {
  imap = yes
  pop3 = yes
  lmtp = yes
  sieve = yes
}

base_dir = /run/dovecot
listen = *, ::
log_path = /var/log/mail.log
info_log_path = /var/log/mail.log

# Require encryption for all public protocol listeners. The one exception is
# the explicit IPv4-loopback IMAP listener used only by Nextcloud's local
# user_external backend.
ssl = required
auth_mechanisms {
  plain = yes
  login = yes
}
ssl_server_cert_file = __STORAGE_ROOT__/ssl/ssl_certificate.pem
ssl_server_key_file = __STORAGE_ROOT__/ssl/ssl_private_key.pem
ssl_min_protocol = TLSv1.2

default_process_limit = 100
default_vsz_limit = 256M

mail_driver = maildir
mail_path = %{home}
mail_uid = mail
mail_gid = mail
mail_privileged_group = mail
# The Debian mail account is uid 8. Do not broaden the accepted UID range to
# root or other system accounts merely to admit this virtual-mail owner.
first_valid_uid = 8

mail_plugins {
  quota = yes
}

namespace inbox {
  inbox = yes

  mailbox INBOX {
    auto = subscribe
  }
  mailbox Spam {
    special_use = \\Junk
    auto = subscribe
  }
  mailbox Drafts {
    special_use = \\Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \\Sent
    auto = subscribe
  }
  mailbox Trash {
    special_use = \\Trash
    auto = subscribe
  }
  mailbox Archive {
    special_use = \\Archive
    auto = subscribe
  }
  mailbox "Sent Messages" {
    special_use = \\Sent
  }
  mailbox Junk {
    special_use = \\Junk
  }
}

quota "User quota" {
  # Preserve the existing Maildir++ maildirsize quota accounting.
  driver = maildir
}

passdb sql {
  sql_driver = sqlite
  sqlite_path = __STORAGE_ROOT__/mail/users.sqlite
  default_password_scheme = SHA512-CRYPT
  query = SELECT email AS user, password FROM users WHERE email = '%{user}'
}

userdb sql {
  sql_driver = sqlite
  sqlite_path = __STORAGE_ROOT__/mail/users.sqlite
  query = SELECT email AS user, 'mail' AS uid, 'mail' AS gid, '__STORAGE_ROOT__/mail/mailboxes/' || '%{user | domain}' || '/' || '%{user | username}' AS home, quota || 'B' AS quota_storage_size FROM users WHERE email = '%{user}'
  iterate_query = SELECT email AS user FROM users
}

service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}

service imap-login {
  inet_listener imap {
    port = 0
  }
  # Nextcloud user_external authenticates against this local-only listener.
  inet_listener imap-local {
    listen = 127.0.0.1
    port = 143
    ssl = no
  }
  inet_listener imaps {
    port = 993
    ssl = yes
  }
}

service pop3-login {
  inet_listener pop3 {
    port = 0
  }
  inet_listener pop3s {
    port = 995
    ssl = yes
  }
}

service lmtp {
  inet_listener lmtp {
    listen = 127.0.0.1
    port = 10026
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
  inet_listener sieve_deprecated {
    port = 0
  }
}

service quota-status {
  executable = quota-status -p postfix
  inet_listener quota-status {
    listen = 127.0.0.1
    port = 12340
  }
}

protocol imap {
  mail_max_userip_connections = 40
  imap_idle_notify_interval = 4 mins
  mail_plugins {
    imap_quota = yes
    imap_sieve = yes
  }
}

protocol pop3 {
  pop3_uidl_format = %{uid | hex(8)}%{uidvalidity | hex(8)}
}

protocol lmtp {
  auth_username_format = %{user | lower}
  postmaster_address = postmaster@__PRIMARY_HOSTNAME__
  lmtp_rcpt_check_quota = yes
  mail_plugins {
    sieve = yes
  }
}

# These paths retain the S5 Mail sieve layout. The root-owned before directory
# is the explicit integration point for a scanner-owned filtering rule.
sieve_script before-scanner {
  type = before
  path = /etc/dovecot/sieve/before
}
sieve_script before-global {
  type = before
  path = __STORAGE_ROOT__/mail/sieve/global_before
}
sieve_script personal {
  driver = file
  path = __STORAGE_ROOT__/mail/sieve/%{user | domain}/%{user | username}
  active_path = __STORAGE_ROOT__/mail/sieve/%{user | domain}/%{user | username}.sieve
}
sieve_script after-global {
  type = after
  path = __STORAGE_ROOT__/mail/sieve/global_after
}
sieve_redirect_envelope_from = recipient

# Learn from explicit user moves through IMAPSieve. The scripts are installed
# in the root-owned before directory by setup/rspamd.sh.
sieve_plugins = sieve_imapsieve sieve_extprograms
sieve_pipe_bin_dir = /usr/local/libexec/dovecot
sieve_global_extensions {
  vnd.dovecot.pipe = yes
}
mailbox Spam {
  sieve_script rspamd-learn-spam {
    type = before
    cause = copy
    path = /etc/dovecot/sieve/before/rspamd-learn-spam.sieve
  }
}
imapsieve_from Spam {
  sieve_script rspamd-learn-ham {
    type = before
    cause = copy
    path = /etc/dovecot/sieve/before/rspamd-learn-ham.sieve
  }
}
